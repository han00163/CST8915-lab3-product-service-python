services:
  api:
    build: .
    image: product-service-python:local
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3030}
      WORKERS: ${WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS-*}
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '3030') + '/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
