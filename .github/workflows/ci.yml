name: Python checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: product_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: product_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U product_test -d product_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://product_test:ci_test_password@127.0.0.1:5432/product_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv build
